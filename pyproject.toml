[tool.ruff]
line-length = 100
# Provided code ships as-is by course contract: never linted, never edited.
extend-exclude = [
    "ai/",
    "demo_ai.py",
    "tests/test_ai_smoke.py",
    "tests/conftest.py",
]

[tool.ruff.lint.per-file-ignores]
# scripts bootstrap sys.path before imports by design
"scripts/*.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

# the provided ai package is a fixed contract, not our code
[[tool.mypy.overrides]]
module = "ai.*"
ignore_errors = true
