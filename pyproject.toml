[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# scripts bootstrap sys.path before imports by design
"scripts/*.py" = ["E402"]
# provided files ship as-is and must not be edited
"tests/test_ai_smoke.py" = ["F401"]
"demo_ai.py" = ["F401", "F541"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

# the provided ai package is a fixed contract, not our code
[[tool.mypy.overrides]]
module = "ai.*"
ignore_errors = true
